<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#f3f1e9" />
    <link rel="icon" type="image/png" href="./resources/brand-icon.png" />
    <!-- style-src conserva 'unsafe-inline' porque React y Vite aplican estilos en línea en el renderer; no se agrega upgrade-insecure-requests para no romper el servidor de desarrollo local. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:5173 ws://127.0.0.1:5173; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'"
    />
    <title>Radar Laboral</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
